<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<title>Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" hidden>
  <aside id="side">
    <div class="side-head">
      <span class="brand"><img src="icon-192.png" alt=""><span data-t="brand"></span></span>
      <button id="lock" class="icon-btn" type="button" data-title="lock">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"/></svg>
      </button>
    </div>
    <div class="side-search">
      <input id="q" type="search" autocomplete="off" spellcheck="false">
      <button id="qall" type="button" hidden></button>
    </div>
    <nav id="sections"></nav>
    <div class="side-foot">
      <div id="sync"></div>
      <div id="offline"></div>
      <div class="foot-row">
        <a id="desktop-link" class="link-btn" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer" hidden></a>
        <button id="theme" type="button" class="link-btn"></button>
        <button id="fill" type="button" class="link-btn" hidden></button>
      </div>
    </div>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <header id="top">
      <button id="menu" class="icon-btn" type="button" data-title="menu">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="top-title"><h1 id="title"></h1><div id="subtitle"></div></div>
      <button id="totop" class="icon-btn" type="button" data-title="top">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 19V5M6 11l6-6 6 6"/></svg>
      </button>
      <button id="tobottom" class="icon-btn" type="button" data-title="bottom">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 5v14M6 13l6 6 6-6"/></svg>
      </button>
    </header>
    <div id="banner" hidden></div>
    <div id="scroll"><div id="conv"></div></div>
  </main>
</div>
<div id="gate" hidden>
  <form id="gate-form" autocomplete="on">
    <img src="apple-touch-icon.png" alt="">
    <h1 data-t="gateTitle"></h1>
    <p class="sub" data-t="gateSub"></p>
    <input type="text" name="username" autocomplete="username" value="notes" hidden>
    <input id="pw" type="password" name="password" autocomplete="current-password" required>
    <label class="remember"><input id="remember" type="checkbox"> <span data-t="remember"></span></label>
    <button id="unlock" type="submit" data-t="unlock"></button>
    <p id="gate-msg" class="msg"></p>
    <p class="note" data-t="gateNote"></p>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
